<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tour Route Tool</title>
  <style>
    :root{
      --bd:#e9e9ee;
      --txt:#111;
      --muted:#666;
      --bg:#fff;
      --btn:#fff;
      --shadow:0 10px 30px rgba(0,0,0,.12);
      --radius:14px;
    }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color:var(--txt); background:#fafafa; }
    header { padding:12px 14px; border-bottom:1px solid var(--bd); display:flex; gap:10px; align-items:center; flex-wrap:wrap; background:#fff; position:sticky; top:0; z-index:10; }
    #map { width:100%; height: calc(100vh - 74px); background:#f3f3f6; }
    button, select, input {
      padding:8px 10px; border:1px solid #ddd; border-radius:12px; background:var(--btn); cursor:pointer;
      font-size:13px;
    }
    button:disabled, select:disabled, input:disabled { opacity:.55; cursor:not-allowed; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; width:100%; }
    .hint { color:var(--muted); font-size:12px; margin-left:auto; display:flex; align-items:center; gap:8px; }
    .pill { font-size:12px; padding:4px 8px; border:1px solid var(--bd); border-radius:999px; color:#444; background:#fff; }

    /* ===== marker overlay (번호 + 장소명) ===== */
    .markerPin {
      display:flex;
      align-items:center;
      gap:8px;
    
      background:#fff;
      border:1px solid rgba(0,0,0,.16);
      border-radius:999px;
      padding:6px 10px;
    
      box-shadow:0 4px 14px rgba(0,0,0,.12);
      white-space:nowrap;
    
      transform: translate(-50%, -100%);
      pointer-events: auto; /* hover 이벤트 받기 */
    }
    
    .markerNum {
      width:22px;
      height:22px;
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
      font-size:12px;
      color:#fff;
    }
    
    .markerName {
      font-size:12px;
      font-weight:700;
      color:#111;
      max-width:180px;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    
    /* hover 시 살짝 강조 */
    .markerPin:hover {
      box-shadow:0 8px 18px rgba(0,0,0,.16);
      transform: translate(-50%, -102%);
    }
    
    /* ===== image tooltip (InfoWindow content) ===== */
    .iwWrap {
      width:180px;
      padding:8px;
    }
    .iwImg {
      width:100%;
      height:110px;
      object-fit:cover;
      border-radius:10px;
      display:block;
      background:#f2f2f2;
    }
    .iwTitle {
      margin-top:8px;
      font-size:13px;
      font-weight:800;
      color:#111;
      line-height:1.2;
    }

    /* .markerBadge {
      display:flex; align-items:center; gap:6px;
      background:#fff; border:1px solid rgba(0,0,0,.15);
      border-radius:999px; padding:6px 8px;
      box-shadow:0 4px 16px rgba(0,0,0,.12);
      white-space:nowrap;
      transform: translate(-50%, -100%);
    } */
    .markerNum {
      width:20px; height:20px; border-radius:8px;
      display:flex; align-items:center; justify-content:center;
      font-weight:700; font-size:12px; color:#fff;
    }
    .markerName { font-size:12px; color:#111; max-width:180px; overflow:hidden; text-overflow:ellipsis; }
    /* .markerAddr { font-size:11px; color:#666; max-width:220px; overflow:hidden; text-overflow:ellipsis; } */

    /* modal */
    .modalBack {
      position:fixed; inset:0; background:rgba(0,0,0,.35);
      display:flex; align-items:center; justify-content:center;
      z-index:9999; padding:16px;
    }
    .modal {
      background:#fff; border-radius:16px; width:min(1100px, 100%);
      max-height:84vh; overflow:auto; box-shadow:var(--shadow);
      border:1px solid var(--bd);
    }
    .modalHeader{
      padding:12px 14px; border-bottom:1px solid var(--bd);
      display:flex; align-items:center; gap:10px; flex-wrap:wrap;
      position:sticky; top:0; background:#fff; z-index:2;
    }
    .modalTitle{ font-weight:800; }
    .modalBody{ padding:12px 14px 16px; }
    table{ width:100%; border-collapse:collapse; font-size:13px; }
    th, td{ padding:9px 8px; border-bottom:1px solid #f0f0f3; vertical-align:top; }
    th{ text-align:left; font-size:12px; color:#444; background:#fafafa; position:sticky; top:48px; z-index:1; }
    td.right, th.right{ text-align:right; }
    .sub { color:#666; font-size:12px; }
    .warn { color:#b00020; font-weight:700; }
    .ok { color:#0b7; font-weight:700; }
  </style>

<body>
<header>
  <div class="row">
    <strong>Tour Route Tool</strong>

    <button id="initBtn">초기화(팀 시트 생성/연결)</button>
    <button id="openSheetBtn">스프레드시트 열기</button>
    <button id="recalcBtn">경로 계산</button>

    <select id="daySelect" title="day 선택">
      <option value="">전체 day</option>

    <button id="reloadBtn">지도 새로고침</button>
    <button id="timelineBtn">타임라인 보기</button>

    <span class="hint" id="hint">
      <span class="pill" id="sdkState">SDK 로딩 대기…</span>
      <span class="sub" id="smallHint">Kakao Maps SDK 로딩 중</span>
    </span>
  </div>

<div id="map"></div>

<script>
  // -------------------------
  // Helpers
  // -------------------------
  const initBtn = document.getElementById('initBtn');
  const openSheetBtn = document.getElementById('openSheetBtn');
  const recalcBtn = document.getElementById('recalcBtn');
  const reloadBtn = document.getElementById('reloadBtn');
  const timelineBtn = document.getElementById('timelineBtn');
  const daySelect = document.getElementById('daySelect');
  const sdkState = document.getElementById('sdkState');
  const smallHint = document.getElementById('smallHint');

  function setBusy(b){
    [initBtn, openSheetBtn, recalcBtn, reloadBtn, timelineBtn, daySelect].forEach(el => el.disabled = b);
  }
  function escapeHtml(s) {
    return String(s || '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'",'&#39;');
  }

  function hhmmToMin(hhmm) {
    const m = String(hhmm || '').trim().match(/^(\d{1,2}):(\d{2})$/);
    if (!m) return 0;
    return Number(m[1]) * 60 + Number(m[2]);
  }
  function minToHHMM(min) {
    let m = Number(min);
    if (!isFinite(m)) m = 0;
    m = (m % (24*60) + (24*60)) % (24*60);
    const h = Math.floor(m/60);
    const mm = m%60;
    return String(h).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
  }

  // JSONP 호출
  function jsonp(action, params = {}, { timeoutMs = 25000 } = {}) {
    return new Promise((resolve, reject) => {
      const cb = `__cb_${Date.now()}_${Math.floor(Math.random() * 1e6)}`;
  
      const url = new URL(CONFIG.GAS_WEBAPP_URL);
      url.searchParams.set('action', action);
      url.searchParams.set('token', CONFIG.TEAM_API_TOKEN);
      url.searchParams.set('callback', cb);
  
      // ✅ 캐시/중복 방지용 (시크릿에서 특히 안정성↑)
      url.searchParams.set('_', String(Date.now()));
  
      Object.entries(params).forEach(([k, v]) => {
        if (v === undefined || v === null) return;
        url.searchParams.set(k, String(v));
      });
  
      const g = (typeof globalThis !== 'undefined') ? globalThis : window;
  
      let done = false;
      let timer = null;
  
      const script = document.createElement('script');
      script.async = true;
      script.src = url.toString();
  
      const cleanup = () => {
        if (timer) clearTimeout(timer);
        timer = null;
  
        try { delete g[cb]; } catch (e) { g[cb] = undefined; }
  
        if (script && script.parentNode) script.parentNode.removeChild(script);
      };
  
      // ✅ 1) 콜백을 먼저 정의 (globalThis에!)
      g[cb] = (data) => {
        if (done) return;
        done = true;
        cleanup();
        resolve(data);
      };
  
      // ✅ 2) 에러/타임아웃도 done 가드로 중복 방지
      script.onerror = () => {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error('JSONP load error'));
      };
  
      timer = setTimeout(() => {
        if (done) return;
        done = true;
        cleanup();
        reject(new Error('JSONP timeout'));
      }, timeoutMs);
  
      // ✅ 3) body가 없어도 동작하도록 head/body 중 가능한 곳에 삽입
      (document.body || document.head || document.documentElement).appendChild(script);
    });
  }


  // -------------------------
  // Kakao Map init
  // -------------------------
  let map = null;
  let markers = [];     // CustomOverlay
  let polylines = [];   // Polyline
  let lastData = null;  // apiData 결과
  let lastRoute = null; // apiRoute 결과

  const DAY_COLORS = [
    '#2D7FF9', // day1
    '#00B894', // day2
    '#E17055', // day3
    '#6C5CE7', // day4
    '#0984E3', // day5
    '#D63031', // day6
  ];

  function ensureKakaoReady(){
    return (typeof window.kakao !== 'undefined' && kakao.maps);
  }

  async function waitForKakaoAndInitMap(){
    // SDK 스크립트 로드 실패 처리
    for (let i=0; i<120; i++){
      if (window.__kakaoLoadError){
        sdkState.textContent = 'SDK 로드 실패';
        sdkState.className = 'pill warn';
        smallHint.textContent = 'Kakao JS 키/도메인 등록을 확인하세요.';
        return false;
      }
      if (ensureKakaoReady()) break;
      await new Promise(r => setTimeout(r, 150));
    }
    if (!ensureKakaoReady()){
      sdkState.textContent = 'SDK 로딩 지연';
      sdkState.className = 'pill warn';
      smallHint.textContent = '네트워크/키 설정을 확인하세요.';
      return false;
    }

    sdkState.textContent = 'SDK OK';
    sdkState.className = 'pill ok';
    smallHint.textContent = '지도 준비됨';

    // autoload=false로 로드했기 때문에 load 호출 필요
    kakao.maps.load(() => {
      const el = document.getElementById('map');
      const center = new kakao.maps.LatLng(37.5665, 126.9780); // 서울 시청 기본
      map = new kakao.maps.Map(el, { center, level: 7 });
    });

    // load가 비동기라 잠깐 기다림
    for (let i=0; i<40; i++){
      if (map) return true;
      await new Promise(r => setTimeout(r, 100));
    }
    return !!map;
  }

  function clearMapObjects(){
    markers.forEach(m => m.setMap(null));
    polylines.forEach(p => p.setMap(null));
    markers = [];
    polylines = [];
  }

  function fitBounds(points){
    if (!points || !points.length) return;
    const bounds = new kakao.maps.LatLngBounds();
    points.forEach(p => bounds.extend(p));
    map.setBounds(bounds);
  }

  function makeMarkerOverlay(stop, dayColor){
    const pos = new kakao.maps.LatLng(stop.lat, stop.lng);
  
    const num = Number(stop.seq) || 0;
    const name = escapeHtml(stop.name);
  
    // stop.image_url 이 있으면 hover 시 이미지 툴팁을 띄움
    const imgUrl = String(stop.image_url || '').trim();
  
    const content = `
      <div class="markerPin" data-seq="${num}">
        <div class="markerNum" style="background:${dayColor}">${num}</div>
        <div class="markerName">${name}</div>
      </div>
    `;
  
    const overlay = new kakao.maps.CustomOverlay({
      position: pos,
      content,
      yAnchor: 1.05
    });
  
    // ✅ hover 툴팁(InfoWindow)
    // CustomOverlay는 이벤트를 content DOM에 붙여야 함
    // overlay.setMap(map) 이후에 DOM이 생성되므로, 약간 지연 후 바인딩
    overlay.__bindHover = () => {
      const el = overlay.getContent ? overlay.getContent() : null;
  
      // overlay.getContent()는 문자열을 반환하는 경우가 있어 DOM 접근이 안 될 수 있음
      // 그래서 실제 DOM을 query로 찾는 방식이 가장 안정적
      const nodes = document.querySelectorAll('.markerPin');
      let node = null;
      nodes.forEach(n => {
        // 위치 기반으로 특정하기 어려우니, seq로 최근 생성된 것을 우선 사용
        if (String(n.getAttribute('data-seq')) === String(num)) node = n;
      });
  
      if (!node) return;
  
      // 이미지 없으면 hover 기능 자체를 붙이지 않음
      if (!imgUrl) return;
  
      const iw = new kakao.maps.InfoWindow({
        content: `
          <div class="iwWrap">
            <img class="iwImg" src="${escapeHtml(imgUrl)}" alt="photo"/>
            <div class="iwTitle">${escapeHtml(num)}. ${name}</div>
          </div>
        `
      });
  
      // 마우스 오버 / 아웃
      node.addEventListener('mouseenter', () => {
        // InfoWindow는 Marker에 붙이는 게 정석이지만,
        // 우리는 CustomOverlay라 position 기반으로 열어줌
        iw.setPosition(pos);
        iw.open(map);
      });
  
      node.addEventListener('mouseleave', () => {
        iw.close();
      });
    };
  
    return overlay;
  }


  function drawStops(stops){
    const points = [];
    (stops || []).forEach(s => {
      const day = Number(s.day) || 1;
      const color = DAY_COLORS[(day-1) % DAY_COLORS.length];
      const overlay = makeMarkerOverlay(s, color);
      overlay.setMap(map);
      markers.push(overlay);
      
      // ✅ DOM 생성 이후 hover 바인딩
      setTimeout(() => overlay.__bindHover && overlay.__bindHover(), 0);

      points.push(new kakao.maps.LatLng(s.lat, s.lng));
    });
    fitBounds(points);
  }

  function drawRoutes(pathsByDay){
    if (!pathsByDay) return;
    const allPts = [];

    Object.keys(pathsByDay).sort((a,b)=>Number(a)-Number(b)).forEach((dy) => {
      const pts = (pathsByDay[dy] || []).map(p => new kakao.maps.LatLng(p.lat, p.lng));
      if (!pts.length) return;

      const day = Number(dy) || 1;
      const color = DAY_COLORS[(day-1) % DAY_COLORS.length];

      const pl = new kakao.maps.Polyline({
        path: pts,
        strokeWeight: 5,
        strokeColor: color,
        strokeOpacity: 0.85,
        strokeStyle: 'solid'
      });
      pl.setMap(map);
      polylines.push(pl);
      allPts.push(...pts);
    });

    if (allPts.length) fitBounds(allPts);
  }

  function uniqueDaysFromStops(stops){
    const s = new Set();
    (stops||[]).forEach(x => {
      const d = String(x.day ?? '').trim();
      if (d) s.add(d);
    });
    return Array.from(s).sort((a,b)=>Number(a)-Number(b));
  }

  function syncDaySelectFromData(data){
    const days = uniqueDaysFromStops(data?.stops || []);
    const current = daySelect.value || '';
    daySelect.innerHTML = `<option value="">전체 day</option>` + days.map(d => `<option value="${escapeHtml(d)}">day ${escapeHtml(d)}</option>`).join('');
    // 이전 선택값 유지(가능하면)
    if (days.includes(current)) daySelect.value = current;
    else daySelect.value = '';
  }

  // -------------------------
  // Data loading
  // -------------------------
  async function refreshAll(){
    if (!map) return;

    setBusy(true);
    try{
      const day = daySelect.value || ''; // 선택된 day로 route/data를 필터링

      // 1) data (stops + legs + start_time 등)
      const data = await jsonp('data', { day });
      if (!data || !data.ok){
        alert(data?.error || 'data 로드 실패 (init/recalc/token 확인)');
        return;
      }
      lastData = data;
      syncDaySelectFromData(data);

      // 2) route (도로 polyline)
      const route = await jsonp('route', { day: daySelect.value || '' });
      if (!route || !route.ok){
        // route는 실패해도 마커/데이터는 보여줄 수 있게
        lastRoute = null;
        clearMapObjects();
        drawStops(lastData.stops);
        sdkState.textContent = 'Route 일부 실패';
        sdkState.className = 'pill warn';
        smallHint.textContent = route?.error ? `경로: ${route.error}` : '도로 경로 로드 실패';
        return;
      }
      lastRoute = route;

      clearMapObjects();
      drawStops(lastData.stops);
      drawRoutes(lastRoute.pathsByDay);

      sdkState.textContent = '표시 완료';
      sdkState.className = 'pill ok';
      smallHint.textContent = `Stops ${lastData.stops.length}개 · day ${daySelect.value || '전체'}`;

    }catch(err){
      alert(err.message || String(err));
    }finally{
      setBusy(false);
    }
  }

  // -------------------------
  // Timeline popup (웹앱에서만)
  // -------------------------
  function buildTimelineForPopup(stops, legs, startTimeHHMM){
    const sorted = (stops || []).slice().sort((a,b)=>Number(a.seq)-Number(b.seq));
    const legMap = new Map((legs||[]).map(l => [`${l.from_seq}->${l.to_seq}`, Number(l.drive_min_buf||0)]));
    let t = hhmmToMin(startTimeHHMM || '08:30');

    const rows = [];
    let sumDrive = 0;
    let sumStay = 0;

    for (let i=0; i<sorted.length; i++){
      const s = sorted[i];

      if (i>0){
        const prev = sorted[i-1];
        const dm = (legMap.get(`${prev.seq}->${s.seq}`) || 0);
        t += dm;
        sumDrive += dm;
      }
      const arrive = t;
      const stay = Number(s.stay_min || 0);
      const depart = arrive + stay;
      sumStay += stay;
      t = depart;

      rows.push({
        day: s.day,
        seq: s.seq,
        name: s.name,
        road_address: s.road_address || '',
        time_range: `${minToHHMM(arrive)}~${minToHHMM(depart)}`,
        arrive: minToHHMM(arrive),
        depart: minToHHMM(depart),
        stay_min: stay
      });
    }

    const totalMin = sumDrive + sumStay;
    return { rows, sumDrive, sumStay, totalMin };
  }

  function copyTimelineToClipboard(rows, startTime){
    // TSV: seq, name, address, time_range, stay_min
    const header = ['#','장소','주소','시간', '체류(분)'];
    const lines = [header.join('\t')];
    rows.forEach(r => {
      lines.push([r.seq, r.name, r.road_address, r.time_range, r.stay_min].join('\t'));
    });
    const text = lines.join('\n');

    // Clipboard API 우선, 실패 시 fallback
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text);
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    if (!ok) throw new Error('복사 실패: 브라우저 권한/보안 설정 확인');
    return Promise.resolve();
  }

  function showTimelinePopup(){
  if (!lastData || !lastData.ok){
    alert('먼저 "지도 새로고침"으로 데이터를 불러오세요.');
    return;
  }

  // ✅ 상단/테이블 공통 기준 시간 (여기 1번만 정의)
  const startTime = String(lastData.start_time || '08:30').trim();

  // ✅ 테이블 시간은 무조건 이 계산 결과로만 렌더링
  const pack = buildTimelineForPopup(lastData.stops, lastData.legs, startTime);

  const dayLabel = (daySelect.value || '').trim() ? `day ${daySelect.value}` : '전체 day';

  const back = document.createElement('div');
  back.className = 'modalBack';

  const modal = document.createElement('div');
  modal.className = 'modal';

  const totalHH = `${Math.floor(pack.totalMin/60)}시간 ${pack.totalMin%60}분`;
  const driveHH = `${Math.floor(pack.sumDrive/60)}시간 ${pack.sumDrive%60}분`;
  const stayHH  = `${Math.floor(pack.sumStay/60)}시간 ${pack.sumStay%60}분`;

  modal.innerHTML = `
    <div class="modalHeader">
      <div class="modalTitle">타임라인 (${escapeHtml(dayLabel)})</div>
      <div class="pill">시작 ${escapeHtml(startTime)}</div>
      <div class="pill">이동 ${escapeHtml(driveHH)}</div>
      <div class="pill">체류 ${escapeHtml(stayHH)}</div>
      <div class="pill"><b>총 ${escapeHtml(totalHH)}</b></div>
      <button id="copyBtn" style="margin-left:auto;">복사</button>
      <button id="closeBtn">닫기</button>
      <div class="sub" style="width:100%;">
        ※ 시간은 “도착~출발(hh:mm~hh:mm)”이며, 이동시간은 Legs.drive_min_buf(버퍼 포함)를 사용합니다.
      </div>
    </div>
    <div class="modalBody">
      <table>
        <thead>
          <tr>
            <th style="width:56px;">#</th>
            <th style="width:220px;">장소</th>
            <th>주소</th>
            <th style="width:150px;">시간</th>
            <th class="right" style="width:90px;">체류(분)</th>
          </tr>
        </thead>
        <tbody>
          ${pack.rows.map(r => `
            <tr>
              <td>${escapeHtml(r.seq)}</td>
              <td><b>${escapeHtml(r.name)}</b></td>
              <td class="sub">${escapeHtml(r.road_address || '')}</td>
              <td>${escapeHtml(r.time_range)}</td>
              <td class="right">${escapeHtml(r.stay_min)}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>
  `;

  back.appendChild(modal);
  document.body.appendChild(back);

  function close(){ back.remove(); }
  back.addEventListener('click', (e) => { if (e.target === back) close(); });
  modal.querySelector('#closeBtn').addEventListener('click', close);

  modal.querySelector('#copyBtn').addEventListener('click', async () => {
    try{
      await copyTimelineToClipboard(pack.rows, startTime);
      alert('복사 완료! (엑셀/시트에 붙여넣기 가능)');
    }catch(err){
      alert(err.message || String(err));
    }
  });
}


  // -------------------------
  // Buttons
  // -------------------------
  initBtn.addEventListener('click', async () => {
    setBusy(true);
    try{
      const j = await jsonp('init', {}, { timeoutMs: 90000 });
      if (!j.ok) return alert(j.error || 'init 실패');
      alert(`팀 시트 연결 완료!\n\n${j.name}\n${j.spreadsheetUrl}`);
    }catch(err){
      alert(err.message || String(err));
    }finally{
      setBusy(false);
    }
  });

  openSheetBtn.addEventListener('click', async () => {
    setBusy(true);
    try{
      const j = await jsonp('init', {}, { timeoutMs: 90000 });// 없으면 생성, 있으면 반환
      if (!j.ok) return alert(j.error || '시트 열기 실패');
      window.open(j.spreadsheetUrl, '_blank');
    }catch(err){
      alert(err.message || String(err));
    }finally{
      setBusy(false);
    }
  });

  recalcBtn.addEventListener('click', async () => {
    setBusy(true);
    try{
      const j = await jsonp('recalc');
      if (!j.ok) return alert(j.error || 'recalc 실패');
      alert('경로 계산 완료! 이제 "지도 새로고침"을 누르세요.');
    }catch(err){
      alert(err.message || String(err));
    }finally{
      setBusy(false);
    }
  });

  reloadBtn.addEventListener('click', () => refreshAll());
  daySelect.addEventListener('change', () => refreshAll());
  timelineBtn.addEventListener('click', () => showTimelinePopup());

  // -------------------------
  // Boot
  // -------------------------
  (async function boot(){
    // 키/URL 기본검증
    if (!CONFIG.KAKAO_JS_KEY || CONFIG.KAKAO_JS_KEY.includes('여기에_')){
      sdkState.textContent = '키 필요';
      sdkState.className = 'pill warn';
      smallHint.textContent = 'Index.html 상단의 KAKAO_JS_KEY를 설정하세요.';
      return;
    }
    if (!CONFIG.GAS_WEBAPP_URL || CONFIG.GAS_WEBAPP_URL.includes('여기에_')){
      sdkState.textContent = 'URL 필요';
      sdkState.className = 'pill warn';
      smallHint.textContent = 'Index.html 상단의 GAS_WEBAPP_URL을 설정하세요.';
      return;
    }
    if (!CONFIG.TEAM_API_TOKEN || CONFIG.TEAM_API_TOKEN.includes('여기에_')){
      sdkState.textContent = 'token 필요';
      sdkState.className = 'pill warn';
      smallHint.textContent = 'Index.html 상단의 TEAM_API_TOKEN을 설정하세요.';
      return;
    }

    const ok = await waitForKakaoAndInitMap();
    if (!ok) return;

    // 초기 로드
    await refreshAll();
  })();
</script>
</body>
</html>
