<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Tour Route Tool</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { margin:0; font-family: system-ui, sans-serif; }
#topbar {
  padding:10px;
  background:#f3f3f3;
  border-bottom:1px solid #ddd;
  display:flex;
  gap:8px;
}
#map { width:100%; height:calc(100vh - 52px); }

.stop-marker {
  background:#2f6fff;
  color:#fff;
  width:28px;
  height:28px;
  border-radius:50%;
  text-align:center;
  line-height:28px;
  font-weight:600;
  cursor:pointer;
}

.marker-tooltip {
  position:absolute;
  background:#fff;
  border-radius:6px;
  padding:6px;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  z-index:10000;
}
.marker-tooltip img {
  max-width:180px;
  border-radius:4px;
  display:block;
}

.popup {
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  display:flex;
  justify-content:center;
  align-items:center;
}
.popup-content {
  background:#fff;
  width:90%;
  max-height:90%;
  overflow:auto;
  padding:16px;
  border-radius:8px;
}
</style>
</head>

<body>

<div id="topbar">
  <button onclick="init()">초기화</button>
  <button onclick="recalc()">경로계산</button>
  <button onclick="openSheet()">시트 열기</button>
  <button onclick="openTimeline()">타임라인 보기</button>
</div>

<div id="map"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbxY6HaGBb0DgxtiKO3jsUwEJssi2at3tN5pNtPtLwIocLFuW2sJnHk6TPSBsCwfXNX_BQ/exec';
let MAP, CONFIG;
let MARKERS=[], POLYLINES=[];

/* ---------- JSONP ---------- */
function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Math.random().toString(36).slice(2);
    const s=document.createElement('script');
    const t=setTimeout(()=>reject('JSONP timeout'),15000);
    window[cb]=(d)=>{clearTimeout(t);delete window[cb];s.remove();resolve(d);}
    s.src=API+'?'+new URLSearchParams({...params,callback:cb});
    document.body.appendChild(s);
  });
}

/* ---------- Kakao ---------- */
function loadKakao(key){
  return new Promise(res=>{
    if(window.kakao?.maps) return res();
    const s=document.createElement('script');
    s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${key}&autoload=false`;
    s.onload=()=>kakao.maps.load(res);
    document.head.appendChild(s);
  });
}

/* ---------- Core ---------- */
async function init(){
  await jsonp({action:'init',token:getToken()});
  openSheet();
}

async function recalc(){
  await jsonp({action:'recalc',token:getToken()});
  loadMap();
}

async function openSheet(){
  const d=await jsonp({action:'data',token:getToken()});
  window.open(d.spreadsheetUrl,'_blank');
}

async function loadMap(){
  const d=await jsonp({action:'data',token:getToken()});
  if(!CONFIG){
    CONFIG=d.config;
    await loadKakao(CONFIG.kakao_js_key);
    MAP=new kakao.maps.Map(map,{center:new kakao.maps.LatLng(37.5665,126.978),level:7});
  }
  clearMap();
  drawStops(d.stops);
  drawRoutes();
}

/* ---------- Stops ---------- */
function drawStops(stops){
  stops.forEach(s=>{
    const el=document.createElement('div');
    el.className='stop-marker';
    el.textContent=s.seq;

    let tooltip;
    if(s.image_url){
      el.onmouseenter=e=>{
        tooltip=document.createElement('div');
        tooltip.className='marker-tooltip';
        tooltip.innerHTML=`<strong>${s.name}</strong><img src="${s.image_url}">`;
        document.body.appendChild(tooltip);
        tooltip.style.left=e.pageX+'px';
        tooltip.style.top=e.pageY+'px';
      };
      el.onmouseleave=()=>tooltip?.remove();
    }

    const m=new kakao.maps.CustomOverlay({
      position:new kakao.maps.LatLng(s.lat,s.lng),
      content:el,
      yAnchor:1
    });
    m.setMap(MAP);
    MARKERS.push(m);
  });
}

/* ---------- Routes ---------- */
async function drawRoutes(){
  const r=await jsonp({action:'route',token:getToken()});
  Object.values(r.pathsByDay).forEach(p=>{
    const line=new kakao.maps.Polyline({
      path:p.map(x=>new kakao.maps.LatLng(x.lat,x.lng)),
      strokeWeight:4,
      strokeColor:'#2f6fff'
    });
    line.setMap(MAP);
    POLYLINES.push(line);
  });
}

/* ---------- Timeline ---------- */
async function openTimeline(){
  const d=await jsonp({action:'data',token:getToken()});
  const html=d.timeline.map(r=>`
    <tr>
      <td>${r.seq}</td>
      <td>${r.place}</td>
      <td>${r.arrive}~${r.depart}</td>
      <td>${r.stay_min}</td>
    </tr>`).join('');
  const p=document.createElement('div');
  p.className='popup';
  p.innerHTML=`
    <div class="popup-content">
      <h3>타임라인 (시작 ${CONFIG.start_time})</h3>
      <table border="1" width="100%">
        <tr><th>순서</th><th>장소</th><th>시간</th><th>체류</th></tr>
        ${html}
      </table>
      <button onclick="this.closest('.popup').remove()">닫기</button>
    </div>`;
  document.body.appendChild(p);
}

/* ---------- Utils ---------- */
function clearMap(){
  MARKERS.forEach(m=>m.setMap(null));
  POLYLINES.forEach(l=>l.setMap(null));
  MARKERS=[];POLYLINES=[];
}
function getToken(){
  return localStorage.TEAM_API_TOKEN ||= prompt('TEAM API TOKEN');
}

loadMap();
</script>
</body>
</html>
