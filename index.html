<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tour Route Tool</title>

  <style>
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; }
    header {
      position: sticky; top:0; z-index:10;
      padding:12px 14px; border-bottom:1px solid #eee; background:#fff;
    }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; width:100%; }
    #map { width:100%; height: calc(100vh - 74px); }
    button, select {
      padding:8px 10px; border:1px solid #ddd; border-radius:10px; background:#fff; cursor:pointer;
    }
    button:disabled, select:disabled { opacity:.5; cursor:not-allowed; }
    .hint { color:#666; font-size:12px; margin-left:auto; }
    .btn-primary { border-color:#111; }
    .btn-warn { border-color:#cc3; }
  </style>

  <!-- ✅ Kakao Maps SDK: async 동적삽입 X (기본 방식) -->
  <script>
    // ✅ 여기 3개만 너 값으로 바꿔
    window.CONFIG = {
      GAS_WEBAPP_URL: "https://script.google.com/macros/s/AKfycbxY6HaGBb0DgxtiKO3jsUwEJssi2at3tN5pNtPtLwIocLFuW2sJnHk6TPSBsCwfXNX_BQ/exec",
      TEAM_API_TOKEN: "tourtool_2025_wjogpgpwglksjw2362dfd",
      KAKAO_JS_KEY: "2f4cbe8e415272a7af886adf1944dd64",
    };
  </script>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=2f4cbe8e415272a7af886adf1944dd64"></script>
</head>

<body>
<header>
  <div class="row">
    <strong>Tour Route Tool</strong>

    <button id="initBtn" class="btn-warn">초기화(init)</button>
    <button id="openSheetBtn">Stops 시트 열기</button>
    <button id="recalcBtn" class="btn-primary">경로 계산(recalc)</button>

    <select id="daySelect">
      <option value="">전체 day</option>
    </select>

    <button id="reloadBtn">지도 새로고침</button>
    <button id="timelineBtn">타임라인 보기</button>

    <span class="hint" id="hint">대기중…</span>
  </div>
</header>

<div id="map"></div>

<script>
(function(){
  const CONFIG = window.CONFIG;

  const initBtn = document.getElementById('initBtn');
  const openSheetBtn = document.getElementById('openSheetBtn');
  const recalcBtn = document.getElementById('recalcBtn');
  const reloadBtn = document.getElementById('reloadBtn');
  const timelineBtn = document.getElementById('timelineBtn');
  const daySelect = document.getElementById('daySelect');
  const hint = document.getElementById('hint');

  function setBusy(b){
    [initBtn, openSheetBtn, recalcBtn, reloadBtn, timelineBtn, daySelect]
      .forEach(el => el && (el.disabled = !!b));
  }

  function ensureKakaoReady(){
    return (typeof kakao !== 'undefined' && kakao.maps && typeof kakao.maps.LatLng === 'function');
  }

  function escapeHtml(s){
    return String(s ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#39;");
  }

  // ✅ JSONP (기본 안정 패턴, 60초)
  function jsonp(action, params = {}) {
    return new Promise((resolve, reject) => {
      const cb = `__cb_${Date.now()}_${Math.floor(Math.random()*1e6)}`;
      const url = new URL(CONFIG.GAS_WEBAPP_URL);
      url.searchParams.set('action', action);
      url.searchParams.set('token', CONFIG.TEAM_API_TOKEN);
      url.searchParams.set('callback', cb);
      Object.entries(params).forEach(([k,v]) => {
        if (v === undefined || v === null) return;
        url.searchParams.set(k, String(v));
      });

      const script = document.createElement('script');
      let done = false;

      const timer = setTimeout(() => {
        cleanup();
        reject(new Error('JSONP timeout'));
      }, 60000);

      function cleanup(){
        if (done) return;
        done = true;
        clearTimeout(timer);
        try { delete window[cb]; } catch(e) { window[cb] = undefined; }
        if (script && script.parentNode) script.parentNode.removeChild(script);
      }

      window[cb] = (data) => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error('JSONP load error')); };
      script.src = url.toString();
      document.body.appendChild(script);
    });
  }

  // ========= map render state =========
  let map = null;
  let markers = [];
  let overlays = [];
  let polylines = [];

  const DAY_COLORS = ['#1f77b4','#ff7f0e','#2ca02c','#d62728','#9467bd','#8c564b','#e377c2'];

  function clearMap(){
    markers.forEach(m => m.setMap(null));
    overlays.forEach(o => o.setMap(null));
    polylines.forEach(p => p.setMap(null));
    markers = [];
    overlays = [];
    polylines = [];
  }

  function ensureMap(center){
    if (!map) map = new kakao.maps.Map(document.getElementById('map'), { center, level: 7 });
    else map.setCenter(center);
  }

  function fitBounds(stops){
    const bounds = new kakao.maps.LatLngBounds();
    stops.forEach(s => bounds.extend(new kakao.maps.LatLng(s.lat, s.lng)));
    map.setBounds(bounds);
  }

  function drawMarkers(stops){
    stops.forEach(s => {
      const pos = new kakao.maps.LatLng(s.lat, s.lng);
      const marker = new kakao.maps.Marker({ position: pos, map });
      markers.push(marker);

      // 숫자+장소명 라벨
      const content =
        `<div style="background:#fff;border:1px solid #ddd;border-radius:999px;padding:4px 8px;
                    box-shadow:0 2px 8px rgba(0,0,0,.08);font-size:12px;white-space:nowrap;">
          <b style="margin-right:6px;">${escapeHtml(s.seq)}</b>${escapeHtml(s.name)}
        </div>`;
      const overlay = new kakao.maps.CustomOverlay({ position: pos, content, yAnchor: 1.35 });
      overlay.setMap(map);
      overlays.push(overlay);
    });
  }

  function drawRoute(pathsByDay, selectedDay){
    const days = Object.keys(pathsByDay || {}).sort((a,b)=>Number(a)-Number(b));
    days.forEach(dy => {
      if (selectedDay && String(selectedDay) !== String(dy)) return;
      const pts = pathsByDay[dy] || [];
      if (!pts.length) return;

      const path = pts.map(p => new kakao.maps.LatLng(p.lat, p.lng));
      const color = DAY_COLORS[(Number(dy)-1) % DAY_COLORS.length];

      const poly = new kakao.maps.Polyline({
        path, strokeWeight: 5, strokeOpacity: 0.8, strokeColor: color, strokeStyle: 'solid'
      });
      poly.setMap(map);
      polylines.push(poly);
    });
  }

  function populateDaySelect(days){
    while (daySelect.options.length > 1) daySelect.remove(1);
    (days || []).forEach(dy => {
      const opt = document.createElement('option');
      opt.value = String(dy);
      opt.textContent = `day ${dy}`;
      daySelect.appendChild(opt);
    });
  }

  async function handleInit(){
    setBusy(true);
    try{
      const j = await jsonp('init');
      if (!j.ok) return alert(j.error || 'init 실패');
      alert(`연결 완료!\n${j.name}\n${j.spreadsheetUrl}`);
    }catch(e){
      alert(e.message || String(e));
    }finally{
      setBusy(false);
    }
  }

  async function handleOpenSheet(){
    setBusy(true);
    try{
      const j = await jsonp('openSheet'); // url 반환
      if (!j.ok) return alert(j.error || 'openSheet 실패');
      window.open(j.spreadsheetUrl, '_blank');
    }catch(e){
      alert(e.message || String(e));
    }finally{
      setBusy(false);
    }
  }

  async function handleRecalc(){
    setBusy(true);
    try{
      const j = await jsonp('recalc');
      if (!j.ok) return alert(j.error || 'recalc 실패');
      alert('완료! 지도 새로고침/타임라인 보기로 확인하세요.');
    }catch(e){
      alert(e.message || String(e));
    }finally{
      setBusy(false);
    }
  }

  async function loadAndRender(){
    setBusy(true);
    try{
      if (!ensureKakaoReady()){
        hint.textContent = '⚠️ Kakao Maps SDK 미준비 (JS 키/도메인 확인)';
        return;
      }
      hint.textContent = '로딩…';

      const day = daySelect.value || '';
      const data = await jsonp('data', { day });
      if (!data.ok) {
        hint.textContent = '⚠️ 데이터 없음 (init/recalc 필요)';
        return alert(data.error || 'data 실패');
      }

      populateDaySelect(data.days || []);

      const stops = data.stops || [];
      if (!stops.length) {
        hint.textContent = '⚠️ Stops 없음';
        return alert('Stops 좌표가 없습니다. Stops 입력 후 recalc 해주세요.');
      }

      clearMap();
      ensureMap(new kakao.maps.LatLng(stops[0].lat, stops[0].lng));
      drawMarkers(stops);

      // 도로 라인
      const route = await jsonp('route', { day });
      if (route && route.ok) drawRoute(route.pathsByDay || {}, day);

      fitBounds(stops);
      hint.textContent = '✅ 완료';
    }catch(e){
      hint.textContent = '⚠️ 오류';
      alert(e.message || String(e));
    }finally{
      setBusy(false);
    }
  }

  function minText(min){
    const m = Number(min||0);
    const h = Math.floor(m/60);
    const mm = m%60;
    return h ? `${h}시간 ${mm}분` : `${mm}분`;
  }

  function tableToTSV(table){
    const rows = Array.from(table.querySelectorAll('tr'));
    return rows.map(tr =>
      Array.from(tr.children).map(td => td.innerText.replace(/\s+/g,' ').trim()).join('\t')
    ).join('\n');
  }

  async function openTimelinePopup(){
    setBusy(true);
    try{
      const day = daySelect.value || '';
      const j = await jsonp('timeline', { day });
      if (!j.ok) return alert(j.error || 'timeline 실패');

      const rows = j.rows || [];
      if (!rows.length) return alert('Timeline 데이터가 없습니다. recalc 먼저 실행하세요.');

      const totalsByDay = j.totalsByDay || {};
      const startTime = (j.config && j.config.start_time) ? String(j.config.start_time) : '08:30';

      const title = day ? `day ${day}` : '전체 day';

      const totalText = day
        ? minText(totalsByDay[String(day)] || 0)
        : Object.keys(totalsByDay).sort((a,b)=>Number(a)-Number(b))
            .map(dy => `day ${dy}: ${minText(totalsByDay[dy]||0)}`).join(' / ');

      const w = window.open('', '_blank', 'width=980,height=760');
      if (!w) return alert('팝업 차단됨: 팝업 허용 후 다시 시도');

      const doc = w.document;
      doc.open();
      doc.write('<!doctype html><html><head><meta charset="utf-8"><title></title></head><body></body></html>');
      doc.close();
      doc.title = `Timeline - ${title}`;

      const style = doc.createElement('style');
      style.textContent =
        'body{font-family:system-ui,-apple-system,sans-serif;margin:16px;}' +
        '.top{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;}' +
        '.card{border:1px solid #eee;border-radius:12px;padding:12px 14px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.06);}' +
        'table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}' +
        'th,td{border-bottom:1px solid #eee;padding:8px;vertical-align:top;text-align:left;}' +
        'th{background:#fafafa;position:sticky;top:0;}' +
        'button{padding:8px 10px;border:1px solid #ddd;border-radius:10px;background:#fff;cursor:pointer;}';
      doc.head.appendChild(style);

      const top = doc.createElement('div'); top.className = 'top';
      const c1 = doc.createElement('div'); c1.className='card';
      c1.innerHTML =
        `<div><b>${escapeHtml(title)} 타임라인</b></div>
         <div style="margin-top:6px;color:#666;">출발 시작시간: <b>${escapeHtml(startTime)}</b></div>
         <div style="margin-top:6px;color:#111;">체류시간 포함 총 소요: <b>${escapeHtml(totalText)}</b></div>`;
      const c2 = doc.createElement('div'); c2.className='card';
      const btn = doc.createElement('button'); btn.textContent='표 전체 복사(클립보드)';
      c2.appendChild(btn);
      top.appendChild(c1); top.appendChild(c2);
      doc.body.appendChild(top);

      const table = doc.createElement('table');
      table.innerHTML =
        `<thead><tr>
          <th>day</th><th>seq</th><th>장소</th><th>주소(도로명)</th>
          <th>타임라인</th><th>체류(분)</th><th>이동(분,buf)</th><th>거리(km)</th><th>경고</th>
        </tr></thead>`;
      const tbody = doc.createElement('tbody');

      rows.forEach(r => {
        const tr = doc.createElement('tr');
        const tds = [
          r.day, r.seq, r.place, (r.road_address||''),
          `${r.arrive||''}~${r.depart||''}`, r.stay_min,
          (r.drive_from_prev_min_buf||''), (r.leg_dist_km||''), (r.warning||'')
        ];
        tds.forEach((v, i) => {
          const td = doc.createElement('td');
          td.textContent = String(v ?? '');
          if (i === 3) td.style.color = '#666';
          if (i === 8) td.style.color = '#b00';
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      doc.body.appendChild(table);

      btn.addEventListener('click', async () => {
        try{
          const tsv = tableToTSV(table);
          await w.navigator.clipboard.writeText(tsv);
          w.alert('복사 완료!');
        }catch(e){
          w.alert('복사 실패: 브라우저 권한/HTTPS 확인');
        }
      });

    }catch(e){
      alert(e.message || String(e));
    }finally{
      setBusy(false);
    }
  }

  initBtn.addEventListener('click', handleInit);
  openSheetBtn.addEventListener('click', handleOpenSheet);
  recalcBtn.addEventListener('click', handleRecalc);
  reloadBtn.addEventListener('click', loadAndRender);
  timelineBtn.addEventListener('click', openTimelinePopup);
  daySelect.addEventListener('change', loadAndRender);

  // boot
  if (!CONFIG.KAKAO_JS_KEY || CONFIG.KAKAO_JS_KEY === 'YOUR_KAKAO_JS_KEY') {
    hint.textContent = '⚠️ KAKAO_JS_KEY 설정 필요';
  } else if (!ensureKakaoReady()) {
    hint.textContent = 'SDK 로딩 중…';
    const t = setInterval(() => {
      if (ensureKakaoReady()) { clearInterval(t); hint.textContent='✅ 준비됨'; loadAndRender(); }
    }, 200);
  } else {
    hint.textContent='✅ 준비됨';
    loadAndRender();
  }
})();
</script>
</body>
</html>
