<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tour Route Tool</title>

  <style>
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; }
    header { padding:12px 14px; border-bottom:1px solid #eee; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    #map { width:100%; height: calc(100vh - 74px); }
    button, select { padding:8px 10px; border:1px solid #ddd; border-radius:10px; background:#fff; cursor:pointer; }
    button:disabled, select:disabled { opacity:.5; cursor:not-allowed; }
    .hint { color:#666; font-size:12px; margin-left:auto; }
  </style>

  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=2f4cbe8e415272a7af886adf1944dd64&autoload=false"></script>
</head>

<body>
<header>
  <strong>Tour Route Tool</strong>

  <button id="initBtn">초기화</button>
  <button id="openSheetBtn">Stops 시트</button>
  <button id="recalcBtn">경로 계산</button>

  <select id="daySelect">
    <option value="">전체 day</option>
  </select>

  <button id="reloadBtn">지도 새로고침</button>
  <button id="timelineBtn">타임라인 보기</button>

  <span class="hint" id="hint">SDK 로딩 대기…</span>
</header>

<div id="map"></div>

<!-- ===== Timeline Modal ===== -->
<div id="modalBackdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:9999;">
  <div style="background:#fff; width:90%; max-width:1000px; margin:5vh auto; border-radius:14px; padding:12px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <strong>타임라인</strong>
      <div style="margin-left:auto;">
        <button id="copyTimelineBtn">복사</button>
        <button onclick="closeModal()">닫기</button>
      </div>
    </div>
    <div id="summaryBox" style="margin:10px 0;"></div>
    <div id="timelineTableWrap"></div>
  </div>
</div>

<script>
const GAS_EXEC_URL = 'https://script.google.com/macros/s/AKfycbxY6HaGBb0DgxtiKO3jsUwEJssi2at3tN5pNtPtLwIocLFuW2sJnHk6TPSBsCwfXNX_BQ/exec';
const TEAM_TOKEN = 'tourtool_2025_wjogpgpwglksjw2362dfd';

const daySelect = document.getElementById('daySelect');
const timelineBtn = document.getElementById('timelineBtn');
const modalBackdrop = document.getElementById('modalBackdrop');
const summaryBox = document.getElementById('summaryBox');
const timelineTableWrap = document.getElementById('timelineTableWrap');
const copyTimelineBtn = document.getElementById('copyTimelineBtn');

function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb='cb_'+Math.random().toString(36).slice(2);
    const u=new URL(GAS_EXEC_URL);
    Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,v));
    u.searchParams.set('callback',cb);
    const s=document.createElement('script');
    window[cb]=d=>{ delete window[cb]; s.remove(); resolve(d); };
    s.onerror=()=>{ delete window[cb]; s.remove(); reject(); };
    s.src=u.toString();
    document.head.appendChild(s);
  });
}

function closeModal(){ modalBackdrop.style.display='none'; }

function buildDaySelect(stops){
  const days = [...new Set(stops.map(s => String(s.day)))].sort((a,b)=>a-b);
  daySelect.innerHTML = `<option value="">전체 day</option>` +
    days.map(d => `<option value="${d}">day ${d}</option>`).join('');
}

timelineBtn.onclick = async ()=>{
  const day = daySelect.value || '';
  const d = await jsonp({ action:'data', day, token:TEAM_TOKEN });

  buildDaySelect(d.stops);

  let text = 'day\t순서\t장소\t이동(분)\t누적(분)\n';
  let total = 0;

  d.legs.forEach(l=>{
    text += `${l.day}\t${l.to_seq}\t${l.to_name}\t${l.drive_min_buf}\t${total+=Number(l.drive_min_buf||0)}\n`;
  });

  summaryBox.innerHTML = `<b>총 이동시간:</b> ${total}분`;
  timelineTableWrap.innerHTML = `<pre>${text}</pre>`;

  copyTimelineBtn.onclick = async ()=>{
    await navigator.clipboard.writeText(text);
    alert('타임라인이 복사되었습니다. (엑셀/시트에 바로 붙여넣기 가능)');
  };

  modalBackdrop.style.display='block';
};

window.onload = ()=>{
  kakao.maps.load(async ()=>{
    const d = await jsonp({ action:'data', token:TEAM_TOKEN });
    buildDaySelect(d.stops);
  });
};
</script>
</body>
</html>
