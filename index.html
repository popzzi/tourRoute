  <!-- =========================
       CONFIG (head)
       ========================= -->
  <script>
    window.CONFIG = {
      // ✅ 반드시 /exec URL (Apps Script Web App)
      GAS_WEBAPP_URL: "https://script.google.com/macros/s/AKfycbxY6HaGBb0DgxtiKO3jsUwEJssi2at3tN5pNtPtLwIocLFuW2sJnHk6TPSBsCwfXNX_BQ/exec",

      // ✅ 팀 토큰
      TEAM_API_TOKEN: "tourtool_2025_wjogpgpwglksjw2362dfd",

      // ✅ Kakao JS Key (GitHub Pages 도메인 등록 필요)
      KAKAO_JS_KEY: "2f4cbe8e415272a7af886adf1944dd64"

      // ✅ 샘플 시트 ID (샘플 보기 버튼이 이걸로 엽니다)
      SAMPLE_SSID: "1NVCsRxQq8S8REpzLYOzWpt3hoej4slbvFB38Oya7mCI"

  <!-- =========================
       Kakao SDK: 정적 로드 + autoload=false (안전)
       ========================= -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=2f4cbe8e415272a7af886adf1944dd64&autoload=false"></script>

  <style>
    :root { --bd:#eee; --tx:#111; --sub:#666; --bg:#fff; }
    body { margin:0; font-family: system-ui, -apple-system, sans-serif; color:var(--tx); background:var(--bg); }
    header {
      position: sticky; top: 0; z-index: 1000;
      background: #fff; border-bottom:1px solid var(--bd);
      padding:12px 14px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;
    }
    #map { width:100%; height: calc(100vh - 90px); }
    button, select {
      padding:8px 10px; border:1px solid #ddd; border-radius:10px; background:#fff; cursor:pointer;
      font-size:14px;
    }
    button:disabled, select:disabled { opacity:.55; cursor:not-allowed; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; width:100%; }
    .hint { color:var(--sub); font-size:12px; margin-left:auto; display:flex; gap:8px; align-items:center; }
    .pill { font-size:12px; padding:2px 8px; border-radius:999px; border:1px solid var(--bd); color:#444; background:#fafafa; }
    .danger { color:#b42318; border-color:#fecdca; background:#fffbfa; }
    .ok { color:#027a48; border-color:#abefc6; background:#f6fef9; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.06); z-index: 900; display:none; }
    .overlay.on { display:block; }

    /* Marker label (번호+장소명 + hover 이미지) */
    .markerLabel{
      position: relative;
      padding: 6px 8px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,.18);
      background: rgba(255,255,255,.95);
      box-shadow: 0 2px 10px rgba(0,0,0,.12);
      font-size: 12px;
      line-height: 1.1;
      white-space: nowrap;
      user-select: none;
    }
    .markerLabel b{ font-size: 12px; margin-right:6px; }
    .markerLabel .nm{ font-size: 12px; }
    .markerLabel .img{
      margin-top: 6px;
      width: 160px; height: 90px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.12);
      background: #f3f4f6;
      display:none;
    }
    .markerLabel .img img{ width:100%; height:100%; object-fit: cover; display:block; }
    .markerLabel.showImg .img{ display:block; }

    dialog {
      width: min(980px, calc(100vw - 24px));
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 0;
      box-shadow: 0 10px 40px rgba(0,0,0,.2);
    }
    dialog::backdrop { background: rgba(0,0,0,.25); }
    .dlgHead{ padding: 12px 14px; display:flex; gap:10px; align-items:center; border-bottom: 1px solid var(--bd); }
    .dlgBody{ padding: 12px 14px; max-height: 70vh; overflow:auto; }
    table{ width:100%; border-collapse: collapse; font-size: 13px; }
    th, td{ border-bottom: 1px solid var(--bd); padding: 8px 6px; text-align:left; vertical-align: top; }
    th{ background:#fafafa; position: sticky; top: 0; z-index: 1; }
    .muted{ color: var(--sub); }
    .right{ text-align:right; }
    .btnGhost{ background:#fafafa; }
  </style>

  <!-- =========================
       Main script (defer)
       ========================= -->
  <script defer>
  window.addEventListener('DOMContentLoaded', () => {
    const CONFIG = window.CONFIG || {};

    /***********************
     * JSONP
     ***********************/
    function jsonp(action, params = {}, opt = {}) {
      const timeoutMs = opt.timeoutMs ?? 90000;

      return new Promise((resolve, reject) => {
        const cb = `__cb_${Date.now()}_${Math.floor(Math.random()*1e6)}`;
        const url = new URL(CONFIG.GAS_WEBAPP_URL);

        url.searchParams.set('action', action);
        url.searchParams.set('token', CONFIG.TEAM_API_TOKEN);
        url.searchParams.set('callback', cb);
        url.searchParams.set('_', String(Date.now())); // cache-bust

        Object.entries(params).forEach(([k,v]) => {
          if (v === undefined || v === null) return;
          url.searchParams.set(k, String(v));
        });

        let done = false;
        const script = document.createElement('script');
        script.async = true;

        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('JSONP timeout'));
        }, timeoutMs);

        function cleanup(){
          if (done) return;
          done = true;
          clearTimeout(timer);
          try { delete window[cb]; } catch(e) { window[cb] = undefined; }
          if (script.parentNode) script.parentNode.removeChild(script);
        }

        window[cb] = (data) => { cleanup(); resolve(data); };

        script.onerror = () => { cleanup(); reject(new Error('JSONP load error')); };

        // ✅ "로드 됐는데 callback 미호출"도 잡기
        script.onload = () => {
          setTimeout(() => {
            if (!done) { cleanup(); reject(new Error('JSONP loaded but callback not called')); }
          }, 0);
        };

        script.src = url.toString();
        document.head.appendChild(script);
      });
    }

    /***********************
     * Kakao SDK ready (autoload=false)
     ***********************/
    function waitKakaoMapsReady(timeoutMs = 15000) {
      return new Promise((resolve, reject) => {
        const t0 = Date.now();
        (function tick(){
          if (window.kakao && kakao.maps && typeof kakao.maps.load === 'function') {
            kakao.maps.load(() => resolve(true));
            return;
          }
          if (Date.now() - t0 > timeoutMs) return reject(new Error('Kakao SDK load timeout'));
          setTimeout(tick, 100);
        })();
      });
    }

    /***********************
     * Helpers
     ***********************/
    function escapeHtml(s) {
      return String(s || '')
        .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
        .replaceAll('"','&quot;').replaceAll("'","&#39;");
    }
    function safeMsg(err) { return err?.message || String(err); }

    function setPill(el, text, cls) {
      if (!el) return;
      el.textContent = text;
      el.className = 'pill ' + (cls || '');
    }

    function isIncognitoHint() {
      // 완벽한 감지는 불가. 안내용 힌트만.
      return (
        navigator.cookieEnabled === false ||
        (navigator.userAgent.includes('Chrome') && location.protocol === 'https:')
      );
    }

    // ✅ 로그인/계정선택만 수행 (Drive 파일 열지 않음!)
    function openGoogleLoginOnly() {
      window.open('https://accounts.google.com/AccountChooser', '_blank', 'noopener');
    }

    // ✅ 샘플/내시트 열기는 "로그인 후" 별도 버튼에서 수행
    function openSpreadsheetById(ssid, newTab = false) {
      const url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(ssid)}/edit?usp=sharing`;
      if (newTab) window.open(url, '_blank', 'noopener');
      else window.location.href = url; // ✅ 시크릿/권한 흐름 이슈 최소화
    }

    /***********************
     * DOM
     ***********************/
    const overlay = document.getElementById('overlay');
    const sdkPill = document.getElementById('sdkPill');
    const gasPill = document.getElementById('gasPill');
    const hintText = document.getElementById('hintText');

    const daySelect = document.getElementById('daySelect');

    const dlg = document.getElementById('dlg');
    const dlgTitle = document.getElementById('dlgTitle');
    const dlgMeta = document.getElementById('dlgMeta');
    const dlgBody = document.getElementById('dlgBody');

    // Buttons
    const authBtn = document.getElementById('authBtn');
    const sampleBtn = document.getElementById('sampleBtn');

    const copyBtn = document.getElementById('copyBtn');
    const openMySheetBtn = document.getElementById('openMySheetBtn');
    const setActiveBtn = document.getElementById('setActiveBtn');

    const recalcBtn = document.getElementById('recalcBtn');
    const reloadBtn = document.getElementById('reloadBtn');
    const timelineBtn = document.getElementById('timelineBtn');

    const buttonsForBusy = [
      authBtn, sampleBtn,
      copyBtn, openMySheetBtn, setActiveBtn,
      recalcBtn, reloadBtn, timelineBtn,
      daySelect
    ].filter(Boolean);

    function setBusy(b) {
      if (overlay) overlay.classList.toggle('on', b);
      buttonsForBusy.forEach(el => el.disabled = b);
    }

    /***********************
     * Map
     ***********************/
    let map = null;
    let markers = [];
    let polylines = [];
    const DAY_COLORS = ['#2563eb','#16a34a','#dc2626','#7c3aed','#0891b2','#f97316'];

    function clearMap() {
      markers.forEach(m => m.setMap && m.setMap(null));
      markers = [];
      polylines.forEach(p => p.setMap && p.setMap(null));
      polylines = [];
    }

    function makeMarkerContent(stop) {
      const hasImg = !!(stop.image_url && String(stop.image_url).trim());
      const imgHtml = hasImg
        ? `<div class="img"><img src="${escapeHtml(stop.image_url)}" alt="img"/></div>`
        : '';
      return `
        <div class="markerLabel" data-hasimg="${hasImg ? '1' : '0'}">
          <div><b>${escapeHtml(stop.seq)}</b><span class="nm">${escapeHtml(stop.name)}</span></div>
          ${imgHtml}
        </div>
      `;
    }

    function attachMarkerHoverOnce() {
      const els = document.querySelectorAll('.markerLabel');
      els.forEach(el => {
        if (el.__bound) return;
        el.__bound = true;
        if (el.dataset.hasimg === '1') {
          el.addEventListener('mouseenter', () => el.classList.add('showImg'));
          el.addEventListener('mouseleave', () => el.classList.remove('showImg'));
        }
      });
    }

    function renderStopsAndRoute(stops, pathsByDay, selectedDay) {
      if (!window.kakao || !kakao.maps) {
        setPill(sdkPill, 'SDK 미로드', 'danger');
        return;
      }
      setPill(sdkPill, 'SDK OK', 'ok');

      if (!stops || !stops.length) {
        alert('Stops 좌표가 없습니다.\n"내 시트 만들기(복사)" → Stops 입력 → "경로 계산" 후 다시 시도하세요.');
        return;
      }

      if (!map) {
        const center = new kakao.maps.LatLng(stops[0].lat, stops[0].lng);
        map = new kakao.maps.Map(document.getElementById('map'), { center, level: 7 });
      }

      clearMap();

      // markers
      stops.forEach(s => {
        const pos = new kakao.maps.LatLng(s.lat, s.lng);
        const ov = new kakao.maps.CustomOverlay({
          position: pos,
          content: makeMarkerContent(s),
          yAnchor: 1
        });
        ov.setMap(map);
        markers.push(ov);
      });

      setTimeout(attachMarkerHoverOnce, 0);

      // polylines (day별 색)
      Object.keys(pathsByDay || {}).forEach((dy, idx) => {
        if (selectedDay && String(dy) !== String(selectedDay)) return;
        const pts = pathsByDay[dy] || [];
        if (!pts.length) return;

        const path = pts.map(p => new kakao.maps.LatLng(p.lat, p.lng));
        const color = DAY_COLORS[(Number(dy) - 1) % DAY_COLORS.length] || DAY_COLORS[idx % DAY_COLORS.length];

        const poly = new kakao.maps.Polyline({
          path,
          strokeWeight: 5,
          strokeOpacity: 0.85,
          strokeStyle: 'solid',
          strokeColor: color
        });
        poly.setMap(map);
        polylines.push(poly);
      });

      // bounds
      const bounds = new kakao.maps.LatLngBounds();
      stops.forEach(s => bounds.extend(new kakao.maps.LatLng(s.lat, s.lng)));
      map.setBounds(bounds);
    }

    /***********************
     * Data / Timeline popup
     ***********************/
    let lastData = null;

    function buildDayOptionsFromStops(stops) {
      const days = Array.from(new Set((stops || []).map(s => String(s.day)).filter(Boolean)))
        .map(Number).filter(Number.isFinite)
        .sort((a,b) => a-b);

      const current = daySelect ? daySelect.value : '';
      if (daySelect) {
        daySelect.innerHTML =
          `<option value="">전체 day</option>` +
          days.map(d => `<option value="${d}">day ${d}</option>`).join('');
        daySelect.value = days.includes(Number(current)) ? current : '';
      }
    }

    async function refreshAll() {
      const day = (daySelect && daySelect.value) ? daySelect.value : '';

      await waitKakaoMapsReady();

      const data = await jsonp('data', { day }, { timeoutMs: 90000 });
      if (!data.ok) throw new Error(data.error || 'data failed');
      lastData = data;

      buildDayOptionsFromStops(data.stops || []);

      const route = await jsonp('route', { day }, { timeoutMs: 120000 });
      if (!route.ok) throw new Error(route.error || 'route failed');

      renderStopsAndRoute(data.stops || [], route.pathsByDay || {}, day);
    }

    function tableToTSV(table) {
      const rows = Array.from(table.querySelectorAll('tr'));
      return rows.map(tr => {
        const cells = Array.from(tr.querySelectorAll('th,td'));
        return cells.map(td => td.innerText.replace(/\s+/g,' ').trim()).join('\t');
      }).join('\n');
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
      } catch (_) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    }

    function openTimelinePopup() {
      if (!lastData?.ok) return alert('먼저 "지도 새로고침"으로 데이터를 로드하세요.');

      const stops = lastData.stops || [];
      const legs = lastData.legs || [];
      const day = (daySelect && daySelect.value) ? daySelect.value : '';

      const filteredStops = day ? stops.filter(s => String(s.day) === String(day)) : stops;
      const filteredLegs = day ? legs.filter(l => String(l.day) === String(day)) : legs;

      const totalDrive = filteredLegs.reduce((sum, l) => sum + Number(l.drive_min_buf || l.drive_min || 0), 0);
      const totalStay = filteredStops.reduce((sum, s) => sum + Number(s.stay_min || 0), 0);
      const totalAll = totalDrive + totalStay;

      dlgTitle.textContent = `타임라인 ${day ? `(day ${day})` : '(전체)'}`;
      dlgMeta.textContent = `이동 ${totalDrive}분 + 체류 ${totalStay}분 = 총 ${totalAll}분`;

      const rows = filteredStops
        .sort((a,b) => Number(a.day)-Number(b.day) || Number(a.seq)-Number(b.seq))
        .map(s => {
          const road = s.road_address ? escapeHtml(s.road_address) : `<span class="muted">-</span>`;
          return `
            <tr>
              <td class="right">${escapeHtml(s.day)}</td>
              <td class="right">${escapeHtml(s.seq)}</td>
              <td>${escapeHtml(s.name)}</td>
              <td>${road}</td>
              <td class="right">${Number(s.stay_min || 0)}</td>
              <td class="muted">${escapeHtml(s.geocode_status || '')}</td>
            </tr>
          `;
        }).join('');

      dlgBody.innerHTML = `
        <div class="muted" style="margin-bottom:10px;">
          ※ Timeline 시트(도착/출발 hh:mm 포함)는 "경로 계산" 시 갱신됩니다.
        </div>
        <table id="tlTable">
          <thead>
            <tr>
              <th class="right">day</th>
              <th class="right">seq</th>
              <th>place</th>
              <th>road_address</th>
              <th class="right">stay(min)</th>
              <th>status</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;

      dlg.showModal();
    }

    document.getElementById('closeDlgBtn')?.addEventListener('click', () => dlg.close());
    document.getElementById('copyTableBtn')?.addEventListener('click', async () => {
      const table = document.getElementById('tlTable');
      if (!table) return alert('복사할 테이블이 없습니다.');
      await copyText(tableToTSV(table));
      alert('복사 완료!');
    });

    /***********************
     * Events (role-separated)
     ***********************/
    authBtn?.addEventListener('click', () => {
      // ✅ 로그인/계정선택만
      openGoogleLoginOnly();
    });

    sampleBtn?.addEventListener('click', () => {
      if (!CONFIG.SAMPLE_SSID) {
        alert('CONFIG.SAMPLE_SSID가 설정되지 않았습니다.');
        return;
      }
      // ✅ 샘플 시트 열기 (로그인 후 별도 동작)
      openSpreadsheetById(CONFIG.SAMPLE_SSID, false);
    });

    copyBtn?.addEventListener('click', async () => {
      try {
        setBusy(true);
        const j = await jsonp('makeCopy', {}, { timeoutMs: 180000 });
        if (!j.ok) return alert(j.error || '복사 실패');
        alert(`내 시트 생성 완료!\n${j.name}\n\n이제 "내 시트 열기" 또는 "지도 새로고침"을 진행하세요.`);
      } catch (e) {
        alert(safeMsg(e));
      } finally {
        setBusy(false);
      }
    });

    openMySheetBtn?.addEventListener('click', async () => {
      try {
        setBusy(true);
        const j = await jsonp('openSheet', {}, { timeoutMs: 60000 });
        if (!j.ok) return alert(j.error || '내 시트가 없습니다. "내 시트 만들기(복사)"부터 해주세요.');
        // ✅ 시크릿/쿠키 문제 회피: 현재탭 이동
        window.location.href = j.spreadsheetUrl;
      } catch (e) {
        alert(safeMsg(e));
      } finally {
        setBusy(false);
      }
    });

    setActiveBtn?.addEventListener('click', async () => {
      const ssid = prompt('연결할 스프레드시트 ID를 입력하세요\n(https://docs.google.com/spreadsheets/d/XXXX/edit 에서 XXXX)');
      if (!ssid) return;
      try {
        setBusy(true);
        const j = await jsonp('setActive', { ssid }, { timeoutMs: 60000 });
        if (!j.ok) return alert(j.error || 'setActive 실패');
        alert(`연결 완료: ${j.name}\n이제 "지도 새로고침"을 누르세요.`);
      } catch (e) {
        alert(safeMsg(e));
      } finally {
        setBusy(false);
      }
    });

    recalcBtn?.addEventListener('click', async () => {
      try {
        setBusy(true);
        const j = await jsonp('recalc', {}, { timeoutMs: 180000 });
        if (!j.ok) return alert(j.error || 'recalc 실패');
        alert('경로 계산 완료! 이제 "지도 새로고침"을 누르세요.');
      } catch (e) {
        alert(safeMsg(e));
      } finally {
        setBusy(false);
      }
    });

    reloadBtn?.addEventListener('click', async () => {
      try {
        setBusy(true);
        await refreshAll();
      } catch (e) {
        alert(safeMsg(e));
      } finally {
        setBusy(false);
      }
    });

    timelineBtn?.addEventListener('click', () => openTimelinePopup());

    daySelect?.addEventListener('change', async () => {
      try {
        setBusy(true);
        await refreshAll();
      } catch (e) {
        alert(safeMsg(e));
      } finally {
        setBusy(false);
      }
    });

    /***********************
     * Boot
     ***********************/
    (async function boot(){
      // 안내문
      if (hintText) {
        hintText.textContent =
          '※ "권한승인(로그인)"은 로그인만 수행합니다. 시트는 "샘플 시트 열기/내 시트 열기"로 여세요. (시크릿 모드에서는 Drive 접근이 제한될 수 있음)';
      }

      setPill(sdkPill, 'SDK 로딩…', '');
      try {
        await waitKakaoMapsReady(15000);
        setPill(sdkPill, 'SDK OK', 'ok');
      } catch {
        setPill(sdkPill, 'SDK 미로드', 'danger');
      }

      setPill(gasPill, 'GAS 체크…', '');
      try {
        const j = await jsonp('health', {}, { timeoutMs: 20000 });
        setPill(gasPill, j.ok ? 'GAS OK' : 'GAS 응답 이상', j.ok ? 'ok' : 'danger');
      } catch {
        setPill(gasPill, 'GAS 연결 실패', 'danger');
      }

      // active가 있으면 자동 로드(가능한 경우만)
      try {
        const j = await jsonp('getActive', {}, { timeoutMs: 30000 });
        if (j.ok && j.active) {
          // 자동 로드는 강제하지 않고, 사용자에게 알림만
          setPill(gasPill, '내 시트 연결됨', 'ok');
        }
      } catch {
        // ignore
      }

      if (isIncognitoHint()) {
        console.log('Incognito hint: may cause Drive open issues.');
      }
    })();
  });
  </script>
</head>

<body>
  <div class="overlay" id="overlay"></div>

  <header>
    <div class="row">
      <strong>Tour Route Tool</strong>

      <!-- ✅ 역할 분리 -->
      <button id="authBtn" class="btnGhost">권한승인(로그인)</button>
      <button id="sampleBtn">샘플 시트 열기</button>

      <button id="copyBtn">내 시트 만들기(복사)</button>
      <button id="openMySheetBtn">내 시트 열기</button>
      <button id="setActiveBtn" class="btnGhost">내 시트 연결(SSID)</button>

      <button id="recalcBtn">경로 계산</button>

      <select id="daySelect" title="day 선택">

      <button id="reloadBtn">지도 새로고침</button>
